name: Live RSS smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'core/hotspots/rss.mjs'
      - 'core/hotspots/rsshub.mjs'
      - 'scripts/collect-hotspots.mjs'
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run real public RSS collection
        run: npm run hotspots:collect
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HOTSPOT_RSS_FEEDS: ${{ secrets.HOTSPOT_RSS_FEEDS }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          RSSHUB_ROUTES: ${{ secrets.RSSHUB_ROUTES }}
          DINGTALK_BOT_WEBHOOK: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-rss-smoke-report
          path: data/reports/
          if-no-files-found: warn
          retention-days: 7
