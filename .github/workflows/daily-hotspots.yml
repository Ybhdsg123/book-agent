name: Daily public hotspot discovery
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run hotspots:collect
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HOTSPOT_RSS_FEEDS: ${{ secrets.HOTSPOT_RSS_FEEDS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-hotspot-report
          path: data/reports/
          if-no-files-found: warn
          retention-days: 14
